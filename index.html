<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blink - היכרויות בסביבה</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            margin: 0; background: #090d16; color: #f8fafc;
            display: flex; justify-content: center; min-height: 100vh;
        }
        .phone-container {
            width: 100%; max-width: 430px; background: #111827;
            min-height: 100vh; padding: 20px 18px; display: flex; flex-direction: column;
            position: relative;
        }
        header { text-align: center; margin-bottom: 16px; }
        header h1 {
            margin: 0; font-size: 32px; letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ec4899, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header p { margin: 4px 0 0; color: #9ca3af; font-size: 14px; }

        .auth-box {
            background: #1f2937; border-radius: 24px; padding: 22px;
            border: 1px solid #374151;
        }
        .tabs { display: flex; gap: 8px; margin-bottom: 18px; background: #111827; padding: 5px; border-radius: 14px; }
        .tab {
            flex: 1; padding: 10px; border: none; border-radius: 10px; background: transparent;
            color: #9ca3af; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .tab.active { background: #ec4899; color: white; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 13px; color: #d1d5db; margin-bottom: 5px; }
        .input-group input, .input-group select {
            width: 100%; height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid #374151;
            background: #111827; color: white; font-size: 15px; outline: none;
        }
        .input-group input[type="file"] { padding: 8px 10px; height: auto; font-size: 13px; }
        .input-group input:focus { border-color: #ec4899; }
        .row { display: flex; gap: 10px; align-items: flex-end; }
        .row .input-group { flex: 1; }

        .primary-btn {
            width: 100%; padding: 14px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, #ec4899, #f59e0b);
            color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px;
        }
        .error-msg { color: #f87171; font-size: 13px; text-align: center; margin-top: 10px; }

        .user-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: #1f2937; padding: 10px 14px; border-radius: 16px; margin-bottom: 14px;
            border: 1px solid #374151;
        }
        .user-bar-info { display: flex; align-items: center; gap: 10px; }
        .user-bar img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #ec4899; }
        .logout-btn { background: transparent; border: 1px solid #4b5563; color: #9ca3af; padding: 6px 10px; border-radius: 10px; font-size: 12px; cursor: pointer; }

        /* התראת Blink נכנסת */
        .incoming-alert {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(245, 158, 11, 0.2));
            border: 1px solid #ec4899;
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 14px;
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .incoming-header {
            font-size: 13px; font-weight: bold; color: #f472b6; margin-bottom: 8px;
            display: flex; align-items: center; gap: 6px;
        }
        .incoming-body { display: flex; align-items: center; gap: 12px; }
        .incoming-body img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid #f59e0b; }
        .incoming-actions { display: flex; gap: 8px; margin-top: 12px; }
        .accept-btn {
            flex: 2; padding: 10px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #ec4899, #f59e0b);
            color: white; font-weight: bold; font-size: 14px; cursor: pointer;
        }
        .decline-btn {
            flex: 1; padding: 10px; border: 1px solid #4b5563; border-radius: 12px;
            background: #1f2937; color: #9ca3af; font-size: 13px; cursor: pointer;
        }

        /* סרגל ניווט בין רדאר, מפה וצ'אטים */
        .nav-pills {
            display: flex; gap: 6px; margin-bottom: 16px; background: #1f2937;
            padding: 5px; border-radius: 14px; border: 1px solid #374151;
        }
        .nav-pill {
            flex: 1; padding: 10px 6px; border: none; border-radius: 10px; background: transparent;
            color: #9ca3af; font-weight: bold; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .nav-pill.active { background: #ec4899; color: white; }
        .badge {
            background: #f59e0b; color: #111827; font-size: 11px; font-weight: bold;
            padding: 2px 6px; border-radius: 999px;
        }

        .radar-box {
            background: #1f2937; border-radius: 26px; padding: 22px;
            text-align: center; margin-bottom: 18px; border: 1px solid #374151;
            transition: all 0.3s ease;
        }
        .radar-box.active { border-color: #ec4899; box-shadow: 0 0 28px rgba(236, 72, 153, 0.25); }
        .toggle-btn {
            width: 124px; height: 124px; border-radius: 50%; border: none;
            background: #374151; color: white; font-size: 15px; font-weight: bold;
            cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 6px; padding: 10px; line-height: 1.25;
        }
        .radar-box.active .toggle-btn {
            background: linear-gradient(135deg, #ec4899, #db2777);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.6); }
            70% { box-shadow: 0 0 0 22px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
        .status-text { margin-top: 12px; font-size: 14px; color: #e5e7eb; }

        /* עיצוב מפת חום */
        .map-card {
            background: #1f2937; border-radius: 22px; padding: 14px;
            border: 1px solid #374151;
        }
        #blinkMap {
            height: 360px; width: 100%; border-radius: 16px; z-index: 1;
            background: #0f172a;
        }
        .map-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 12px; gap: 10px;
        }
        .refresh-map-btn {
            background: #374151; color: #f8fafc; border: 1px solid #4b5563;
            border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: bold;
            cursor: pointer; white-space: nowrap;
        }
